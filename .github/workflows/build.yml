name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-gui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libudev-dev libvulkan1 mesa-vulkan-drivers
      - name: Install AppImage tool
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          curl --fail --location --retry 3 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build and package
        run: cargo run --locked -p xtask -- --platform "${{ matrix.platform }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: flacora-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: flacora-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "Could not determine package version from Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            draft_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" --jq ".[] | select(.tag_name == \"${tag}\" and .draft == true) | .id" | head -n1)
            if [ -n "$draft_id" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}"
            fi
            gh release create "$tag" release-assets/* --draft --title "$tag" --generate-notes
          fi
